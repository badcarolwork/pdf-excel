<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Spec Tool — KULT</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" defer></script>
</head>
<body>

  <header class="header">
    <div class="header__brand">
      <div class="header__dot"></div>
      Ad Spec Tool
    </div>
    <span class="header__subtitle">KULT Display</span>
  </header>

  <div class="layout">
    <main class="main">
      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-wrap__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
          </svg>
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Search ad formats…"
            autocomplete="off"
          >
        </div>
        <div class="filter-chips">
          <button class="chip chip--active" data-tag="all">All</button>
          <button class="chip" data-tag="interactive">Interactive</button>
          <button class="chip" data-tag="video">Video</button>
          <button class="chip" data-tag="display">Display</button>
          <button class="chip" data-tag="leadgen">Lead Gen</button>
        </div>
      </div>

      <p id="results-meta" class="results-meta">10 formats</p>

      <div id="spec-grid" class="spec-grid"></div>
    </main>

    <aside id="sidebar" class="sidebar">
      <button id="sidebar-close" class="sidebar-close" aria-label="Close panel">×</button>

      <div class="sidebar__header">
        <p class="sidebar__title">Download Queue</p>
        <p id="queue-count" class="sidebar__count">0 / 5 selected</p>
      </div>

      <div class="sidebar__body">
        <div id="queue-empty" class="queue-empty">
          <span class="queue-empty__icon">📋</span>
          Select ad formats from the grid<br>to build your spec bundle.
        </div>
        <div id="queue-list"></div>
      </div>

      <div id="queue-actions" class="sidebar__footer" style="display:none;">
        <div class="dl-row">
          <button id="btn-pdf" class="dl-btn dl-btn--pdf">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="2" y="1" width="10" height="14" rx="1.5"/><line x1="4" y1="5" x2="10" y2="5"/><line x1="4" y1="8" x2="10" y2="8"/><line x1="4" y1="11" x2="7" y2="11"/>
            </svg>
            PDF
          </button>
          <button id="btn-xls" class="dl-btn dl-btn--xls">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="2" y="1" width="12" height="14" rx="1.5"/><line x1="5" y1="5" x2="11" y2="5"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="5" y1="11" x2="11" y2="11"/>
            </svg>
            Excel
          </button>
        </div>
        <button id="btn-clear" class="clear-link">Clear selection</button>
        <p class="max-note">Max 5 specs per download</p>
      </div>
    </aside>
  </div>

  <button id="fab-download" class="fab" aria-label="Open download queue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span id="queue-dot" class="queue-dot"></span>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="loading-overlay" class="loading-overlay" role="alert" aria-live="assertive">
    <div class="loading-box">
      <p class="loading-label">Generating…</p>
      <p class="loading-sub">Please wait</p>
      <div class="loading-bar"><div class="loading-bar__fill"></div></div>
    </div>
  </div>

  <div id="pdf-render-stage" aria-hidden="true"></div>

  <script src="assets/js/bundle.js"></script>
</body>
</html>
