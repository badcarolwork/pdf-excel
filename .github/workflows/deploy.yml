name: Build and Deploy

on:
  push:
    branches:
      - NoteConvertTool

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NoteConvertTool
        uses: actions/checkout@v4
        with:
          ref: NoteConvertTool

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: node build.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: '.github,node_modules,src,tsconfig.json,build.js,package.json,package-lock.json'
          keep_files: false
          commit_message: "deploy: auto-build from NoteConvertTool"
